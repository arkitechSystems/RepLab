<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <g filter="url(#glow)">
    <text x="3" y="24" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="white" letter-spacing="-1">W</text>
    <text x="17" y="24" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#EF4444" letter-spacing="-1">F</text>
  </g>
</svg>
